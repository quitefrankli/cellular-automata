[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growing-nca"
version = "0.1.0"
description = "Local PyTorch reproduction of Growing Neural Cellular Automata"
requires-python = ">=3.12"
dependencies = ["torch>=2.5", "click>=8.1", "pillow>=10", "numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
nca = "nca.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/nca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires a CUDA device"]
